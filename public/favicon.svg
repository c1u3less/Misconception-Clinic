<svg
  width="35"
  height="35"
  viewBox="0 0 35 35"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="Plus icon"
>
  <!-- Offset shadow: Moved to 16,16 (2px difference) -->
  <circle
    cx="16"
    cy="16"
    r="14"
    fill="#17221d"
  />

  <!-- Main circle: Moved to 14,14 -->
  <circle
    cx="14"
    cy="14"
    r="14"
    fill="#a83b2f"
    stroke="#17221d"
    stroke-width="1"
  />

  <!-- Plus sign: Adjusted center to match main circle (14,14) -->
  <path
    d="M14 8V20M8 14H20"
    stroke="#f4f6f1"
    stroke-width="2.5"
    stroke-linecap="square"
  />
</svg>
